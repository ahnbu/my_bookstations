<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마이 북스테이션</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#5b57e0">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="북스테이션">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind CDN의 darkMode 기본값은 'media'라 dark:가 OS의 prefers-color-scheme를 따른다.
        // 이 앱의 테마 정본은 stores/useSettingsStore.ts의 applyTheme()이 body에 붙이는
        // .dark/.light 클래스이므로 'class'로 바꿔 dark:도 앱 테마를 따르게 한다.
        // darkMode: 'class'는 `.dark .dark\:xxx` 형태의 조상 선택자를 만들므로 body 하위 전체에 적용된다.
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        /* Simple line-clamp fallback for browsers that don't support tailwind's plugin */
        .line-clamp-2 {
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }
    </style>
