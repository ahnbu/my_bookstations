<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이 북스테이션 색 시안 2차</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; background: #f4f4f5; color: #18181b; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; margin: 4px 0 6px; }
  h2 { font-size: 17px; margin: 28px 0 6px; }
  p { margin: 0 0 12px; font-size: 14px; color: #52525b; line-height: 1.5; }
  .home { background: #2b2b2b; border-radius: 18px; padding: 18px 8px 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 4px; }
  .app { text-align: center; color: #f4f4f5; font-size: 12px; }
  .ic { width: 58px; height: 58px; border-radius: 15px; margin: 0 auto 6px; display: grid; place-items: center; }
  .ic svg { width: 34px; height: 34px; }
  .badge { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 700; color: #fde68a; }
  .ref { opacity: .85; }
  .phones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pcard { background: #fff; border-radius: 14px; padding: 10px; }
  .pcard b { font-size: 14px; display: block; margin-bottom: 2px; }
  .pcard small { display: block; font-size: 11px; color: #71717a; margin-bottom: 8px; line-height: 1.35; min-height: 30px; }
  .phone { border-radius: 16px; overflow: hidden; border: 1px solid #d4d4d8; background: #0f172a; }
  .bar { height: 20px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 9px; font-weight: 600; color: #e5e7eb; }
  .screen { padding: 10px 8px 14px; color: #e5e7eb; font-size: 10px; }
  .logo svg { width: 18px; height: 18px; }
  .search { background: #1e293b; border-radius: 999px; padding: 6px 9px; color: #94a3b8; margin: 10px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 2px 6px; border-radius: 5px; font-size: 9px; background: #8b8cf5; color: #111; }
  .chip.g { background: #475569; color: #e2e8f0; }
  .nav { height: 22px; display: flex; justify-content: space-around; align-items: center; font-size: 11px; color: #e5e7eb; }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: #71717a; }
  @media (max-width: 520px) { .phones { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>색 시안 2차</h1>
  <p>홈 화면 아이콘과, 앱을 열었을 때의 위아래 막대 색은 따로 정할 수 있습니다.</p>

  <h2>① 홈 화면 아이콘</h2>
  <p>실제 폰 홈 화면과 같은 어두운 바탕에, 참고로 말씀하신 vFlat·삼성 헬스와 나란히 놓았습니다.</p>
  <div class="home" id="home"></div>

  <h2>② 앱을 열었을 때 위아래 막대</h2>
  <p>앱 안 화면(태그·버튼 색)은 그대로 두고, 맨 위 상태 표시줄과 맨 아래 조작 버튼 줄만 비교합니다.</p>
  <div class="phones" id="phones"></div>
</div>
<script>
const book = (stroke) => `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
const icons = [
  { label: "현재", bg: "#5b57e0", ink: "#fff" },
  { label: "1. 민트", bg: "linear-gradient(145deg,#7fe0c4 0%,#45b99d 100%)", ink: "#fff" },
  { label: "2. 초록→청록", bg: "linear-gradient(145deg,#6fe08a 0%,#2bb3a3 55%,#2a8fd6 100%)", ink: "#fff" },
  { label: "3. 연두→민트", bg: "linear-gradient(145deg,#c4ec7a 0%,#5fcfa8 100%)", ink: "#1f3d2e" },
  { label: "4. 짙은 청록", bg: "linear-gradient(145deg,#4fc7a6 0%,#1f8f86 100%)", ink: "#fff" },
];
const refs = [
  { label: "vFlat (참고)", html: `<div class="ic ref" style="background:linear-gradient(145deg,#6fd6bd,#3fae95)"><svg viewBox="0 0 24 24" fill="#fff" opacity=".9"><path d="M3 9l9-4 9 4-9 4z"/><path d="M3 13l9 4 9-4" fill="none" stroke="#fff" stroke-width="1.6"/></svg></div>` },
  { label: "헬스 (참고)", html: `<div class="ic ref" style="background:linear-gradient(145deg,#7be38a,#2fb4a6 55%,#2b8fe0)"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="13" cy="5" r="2.3"/><path d="M7 21c2-6 3-9 6-11 2 2 3 4 5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>` },
  { label: "", html: "" },
];
const home = document.getElementById("home");
for (const i of icons) home.insertAdjacentHTML("beforeend",
  `<div class="app"><div class="ic" style="background:${i.bg}">${book(i.ink)}</div>북스테이션<br><span class="badge">${i.label}</span></div>`);
for (const r of refs) home.insertAdjacentHTML("beforeend", `<div class="app">${r.html}${r.label}</div>`);

const bars = [
  { name: "현재", desc: "인디고로 위아래가 꽉 참", c: "#5b57e0" },
  { name: "가. 앱 배경색", desc: "앱 바탕과 같은 색. 경계가 사라져 하나로 보임", c: "#0f172a" },
  { name: "나. 연필색", desc: "클로드 앱처럼 따뜻한 짙은 회색", c: "#262624" },
];
const phones = document.getElementById("phones");
for (const b of bars) phones.insertAdjacentHTML("beforeend", `
  <div class="pcard"><b>${b.name}</b><small>${b.desc} <span class="hex">${b.c}</span></small>
    <div class="phone">
      <div class="bar" style="background:${b.c}"><span>9:41</span><span>▮▮ 100%</span></div>
      <div class="screen">
        <div class="logo">${book("#60a5fa")}</div>
        <div class="search">도서관 책을 찾고, 내 서재에…</div>
        <div class="chips"><span class="chip">개인 (355)</span><span class="chip">업무 (182)</span><span class="chip">AI (86)</span><span class="chip g">읽는중 (6)</span></div>
      </div>
      <div class="nav" style="background:${b.c}"><span>◁</span><span>○</span><span>▢</span></div>
    </div>
  </div>`);
</script>
</body>
</html>
